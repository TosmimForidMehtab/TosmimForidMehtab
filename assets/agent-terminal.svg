<svg viewBox="0 0 880 252" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace" font-size="14">
  <!-- window -->
  <rect x="1" y="1" width="878" height="250" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <circle cx="26" cy="26" r="6.5" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6.5" fill="#ffbd2e"/>
  <circle cx="70" cy="26" r="6.5" fill="#27c93f"/>
  <text x="440" y="31" text-anchor="middle" font-size="12" fill="#8b949e">tosmim@trinetra: ~/agents</text>
  <line x1="1" y1="44" x2="879" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- session lines, revealed sequentially on a 12s loop -->
  <text x="28" y="76" fill="#e6edf3" opacity="0">
    <tspan fill="#3FB950">$</tspan> agent run --goal <tspan fill="#A5D6FF">"handle 10k conversations"</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.06;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="104" opacity="0">
    <tspan fill="#58A6FF">[planner]</tspan><tspan fill="#8b949e" dx="8">decomposing goal → 3 subtasks</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.125;0.145;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="132" opacity="0">
    <tspan fill="#D2A8FF">[tool]</tspan><tspan fill="#e6edf3" dx="8">whatsapp.send_bulk(queue=<tspan fill="#A5D6FF">"kafka"</tspan>)</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.27;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="160" opacity="0">
    <tspan fill="#D2A8FF">[tool]</tspan><tspan fill="#e6edf3" dx="8">db.upsert(sessions=<tspan fill="#79C0FF">9847</tspan>)</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.375;0.395;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="188" opacity="0">
    <tspan fill="#D29922">[agent]</tspan><tspan fill="#8b949e" dx="8">rate limit hit — retrying with backoff…</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.52;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="216" opacity="0">
    <tspan fill="#3FB950">✔ done</tspan><tspan fill="#e6edf3" dx="8">— all conversations delivered</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.68;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="242" opacity="0">
    <tspan fill="#3FB950">$</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.82;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <!-- blinking cursor on the final prompt -->
  <rect x="44" y="230" width="9" height="16" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.8;0.83;0.86;0.89;0.92;0.95;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
