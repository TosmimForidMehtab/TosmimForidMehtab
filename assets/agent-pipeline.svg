<svg viewBox="0 0 880 150" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3FB950"/>
    </marker>
  </defs>

  <!-- feedback loop: Tools back to Agent -->
  <path d="M 560 50 C 510 2, 380 2, 335 48" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65" marker-end="url(#arrowGreen)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="447" y="14" text-anchor="middle" font-size="11" fill="#3FB950" opacity="0.9">observations</text>

  <!-- forward connectors -->
  <line x1="180" y1="77" x2="243" y2="77" stroke="#58A6FF" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="410" y1="77" x2="473" y2="77" stroke="#58A6FF" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="640" y1="77" x2="703" y2="77" stroke="#58A6FF" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>

  <!-- travelling packet (drawn before nodes so it dips "inside" them) -->
  <g>
    <circle r="9" fill="#58A6FF" opacity="0.25">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 30 77 L 850 77"/>
    </circle>
    <circle r="4.5" fill="#79C0FF">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 30 77 L 850 77"/>
    </circle>
  </g>
  <!-- feedback packet -->
  <g>
    <circle r="7" fill="#3FB950" opacity="0.25">
      <animateMotion dur="3.5s" begin="1.5s" repeatCount="indefinite" path="M 560 50 C 510 2, 380 2, 335 48"/>
    </circle>
    <circle r="3.5" fill="#56D364">
      <animateMotion dur="3.5s" begin="1.5s" repeatCount="indefinite" path="M 560 50 C 510 2, 380 2, 335 48"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="20" y="50" width="160" height="54" rx="13" fill="#0d1117" stroke="#58A6FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Intent</text>
    <text x="100" y="92" text-anchor="middle" font-size="10.5" fill="#8b949e">user goal</text>
  </g>
  <g>
    <rect x="250" y="50" width="160" height="54" rx="13" fill="#0d1117" stroke="#58A6FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Agent</text>
    <text x="330" y="92" text-anchor="middle" font-size="10.5" fill="#8b949e">reason · plan</text>
  </g>
  <g>
    <rect x="480" y="50" width="160" height="54" rx="13" fill="#0d1117" stroke="#58A6FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Tools</text>
    <text x="560" y="92" text-anchor="middle" font-size="10.5" fill="#8b949e">APIs · DBs · queues</text>
  </g>
  <g>
    <rect x="710" y="50" width="160" height="54" rx="13" fill="#0d1117" stroke="#3FB950" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </rect>
    <text x="790" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Result</text>
    <text x="790" y="92" text-anchor="middle" font-size="10.5" fill="#8b949e">shipped</text>
  </g>
</svg>
